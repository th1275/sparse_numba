name: Build and Test sparse_numba

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  check_duplicate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      is_tag: ${{ steps.check.outputs.is_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "should_run=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/* ]] && [[ "${{ github.event_name }}" == "push" ]]; then
            if git tag --points-at HEAD | grep -q "^v"; then
              echo "should_run=false" >> $GITHUB_OUTPUT
            else
              echo "should_run=true" >> $GITHUB_OUTPUT
            fi
            echo "is_tag=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

  # Build wheels - one job per OS (cibuildwheel handles all Python versions)
  build_wheels:
    needs: check_duplicate
    if: ${{ needs.check_duplicate.outputs.should_run == 'true' }}
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel cython numpy setuptools twine
          python -m pip install cibuildwheel

      # Linux specific setup
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsuitesparse-dev libopenblas-dev libsuperlu-dev
          echo "SuperLU header locations:"
          sudo find /usr -name "slu_ddefs.h" | grep superlu
          SUPERLU_HEADER=$(sudo find /usr -name "slu_ddefs.h" | grep superlu | head -n 1)
          if [ -n "$SUPERLU_HEADER" ]; then
            SUPERLU_DIR=$(dirname "$SUPERLU_HEADER")
            echo "Found SuperLU headers at: $SUPERLU_DIR"
            if [ ! -d "/usr/include/superlu" ]; then
              sudo mkdir -p /usr/include/superlu
              sudo cp "$SUPERLU_DIR"/*.h /usr/include/superlu/
            fi
          fi

      # Windows specific setup
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "Checking MinGW..."
          gcc --version || (echo "MinGW not found, installing..." && choco install mingw -y --no-progress)
          MINGW_BIN=$(dirname "$(which gcc)")
          echo "MinGW bin: $MINGW_BIN"
          echo "$MINGW_BIN" >> $GITHUB_PATH
          echo "Checking vendor libraries..."
          ls -la vendor/superlu/lib/ || echo "WARNING: SuperLU libs not found"
          ls -la vendor/superlu/bin/ || echo "WARNING: SuperLU bin not found"
          ls -la vendor/openblas/bin/ || echo "WARNING: OpenBLAS bin not found"

      # The UMFPACK extension is interface-only: it compiles against
      # umfpack.h and links no SuiteSparse library (the user's library is
      # loaded at runtime). Only the HEADERS are taken here: MSYS2's
      # SuiteSparse package is downloaded (pacman -Sw installs nothing) and
      # its include/suitesparse/*.h alone extracted into
      # vendor/suitesparse/include; no SuiteSparse DLL reaches the build or
      # the wheel.
      - name: Install the SuiteSparse headers only (Windows)
        if: runner.os == 'Windows'
        shell: C:\msys64\usr\bin\bash.exe --noprofile --norc -eo pipefail {0}
        run: |
          export PATH=/usr/bin:$PATH
          pacman -Sy --noconfirm
          pacman -Sw --noconfirm mingw-w64-x86_64-suitesparse
          pkg=$(ls /var/cache/pacman/pkg/mingw-w64-x86_64-suitesparse-[0-9]*.pkg.tar.zst | sort -V | tail -n 1)
          echo "headers from: $pkg"
          mkdir -p ss_pkg vendor/suitesparse/include
          tar --zstd -xf "$pkg" -C ss_pkg mingw64/include/suitesparse
          cp ss_pkg/mingw64/include/suitesparse/*.h vendor/suitesparse/include/
          rm -rf ss_pkg
          ls vendor/suitesparse/include
          test -f vendor/suitesparse/include/umfpack.h
          if ls vendor/suitesparse/bin/*.dll >/dev/null 2>&1; then
            echo "a SuiteSparse DLL is in the checkout"; exit 1
          fi

      # macOS specific setup
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install suite-sparse superlu openblas
          export OPENBLAS_PREFIX=$(brew --prefix openblas)
          echo "OpenBLAS prefix: $OPENBLAS_PREFIX"
          mkdir -p $HOME/homebrew_libs/openblas/lib
          ln -sf $OPENBLAS_PREFIX/lib/libopenblas.dylib $HOME/homebrew_libs/openblas/lib/
          echo "OPENBLAS_PREFIX=$OPENBLAS_PREFIX" >> $GITHUB_ENV
          echo "HOME_LIBS=$HOME/homebrew_libs" >> $GITHUB_ENV

      # Build wheels using cibuildwheel
      - name: Build wheels
        env:
          CIBW_BUILD: 'cp310-* cp311-* cp312-* cp313-*'
          CIBW_SKIP: '*-musllinux*'
          CIBW_BEFORE_BUILD: >
            pip install numpy cython
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ARCHS_MACOS: 'arm64'
          CIBW_ARCHS_LINUX: 'x86_64'
          CIBW_ENVIRONMENT: >
            CI=true
            GITHUB_ACTIONS=true
            CFLAGS='-O3'
            CXXFLAGS='-O3'
          CIBW_ENVIRONMENT_MACOS: >
            CI=true
            GITHUB_ACTIONS=true
            CFLAGS='-O3'
            CXXFLAGS='-O3'
            MACOSX_DEPLOYMENT_TARGET=14.0
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          # suitesparse-devel for umfpack.h only: the UMFPACK extension links
          # no SuiteSparse library, so auditwheel has none to bundle (the
          # check after the build asserts it)
          CIBW_BEFORE_ALL_LINUX: |
            yum install -y epel-release || true
            yum install -y openblas-devel SuperLU-devel suitesparse-devel ||
            yum install -y openblas-devel superlu-devel suitesparse-devel ||
            (apt-get update && apt-get install -y libsuitesparse-dev libsuperlu-dev libopenblas-dev)
            find /usr -name "slu_ddefs.h" || echo "SuperLU headers not found"
            HEADER_PATH=$(find /usr -name "slu_ddefs.h" | head -1)
            if [ -n "$HEADER_PATH" ]; then
              HEADER_DIR=$(dirname "$HEADER_PATH")
              mkdir -p /tmp/superlu_include
              if [ -f "$HEADER_DIR/slu_ddefs.h" ]; then
                cp "$HEADER_DIR"/*.h /tmp/superlu_include/ 2>/dev/null || true
              fi
            fi
          CIBW_BEFORE_ALL_MACOS: >
            brew install suite-sparse superlu openblas;
            OPENBLAS_PREFIX=$(brew --prefix openblas);
            echo "OpenBLAS location: $OPENBLAS_PREFIX";
            mkdir -p $HOME/homebrew_libs/openblas/lib;
            ln -sf $OPENBLAS_PREFIX/lib/libopenblas.dylib $HOME/homebrew_libs/openblas/lib/;
            echo "Created symlink in $HOME/homebrew_libs/openblas/lib/"
          # Skip delocate on macOS -- we rely on system-installed libs (brew)
          # just like Linux relies on system libs without bundling
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
            cp {wheel} {dest_dir}/
          CIBW_ARCHS_WINDOWS: 'AMD64'
          CIBW_ENVIRONMENT_WINDOWS: >
            CI=true
            GITHUB_ACTIONS=true
            DISTUTILS_USE_SDK=0
          CIBW_BEFORE_BUILD_WINDOWS: >
            pip install numpy cython setuptools &&
            python -c "import distutils, os; f=os.path.join(os.path.dirname(distutils.__file__),'distutils.cfg'); open(f,'w').write('[build]\ncompiler=mingw32\n[build_ext]\ncompiler=mingw32\n')" &&
            gcc --version

        run: |
          python -m cibuildwheel --output-dir wheelhouse

      # List built wheels for debugging
      - name: List built wheels
        shell: bash
        run: |
          echo "Built wheels:"
          ls -la wheelhouse/

      # No wheel carries a SuiteSparse library (GPL / LGPL; UMFPACK is the
      # user's): a file named after one fails the job
      - name: Check the wheels carry no SuiteSparse library
        shell: bash
        run: |
          python - <<'PY'
          import glob, re, sys, zipfile
          pattern = re.compile(r"(lib)?(umfpack|cholmod|amd|camd|colamd|ccolamd|"
                               r"suitesparseconfig|klu|btf|spqr|cxsparse|ldl)[.-]")
          wheels = sorted(glob.glob("wheelhouse/*.whl"))
          bad = [(whl, name) for whl in wheels for name in zipfile.ZipFile(whl).namelist()
                 if pattern.match(name.rsplit("/", 1)[-1].lower())]
          for whl, name in bad:
              print("%s: %s" % (whl, name))
          print("%d wheel(s) read, %d SuiteSparse file(s)" % (len(wheels), len(bad)))
          sys.exit(1 if bad or not wheels else 0)
          PY

      # Store the built wheels (one artifact per OS, containing all Python versions)
      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: |
            ./wheelhouse/*.whl

  # Test job - test each Python version per OS
  test_installation:
    needs: [check_duplicate, build_wheels]
    if: ${{ needs.check_duplicate.outputs.should_run == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            python-version: '3.10'
          - os: macos-latest
            python-version: '3.11'
          - os: macos-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.13'
          # Windows x86_64
          - os: windows-latest
            python-version: '3.10'
          - os: windows-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.13'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse

      - name: List available wheels
        shell: bash
        run: |
          echo "Available wheels:"
          ls -la wheelhouse/

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsuitesparse-dev libopenblas-dev libsuperlu-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install suite-sparse superlu openblas

      - name: Install the wheel (Unix)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy numba --only-binary=llvmlite
          # Find matching wheel using pip directly (handles platform tags automatically)
          PYTHON_VERSION_NO_DOT=$(echo ${{ matrix.python-version }} | tr -d '.')
          WHEEL_FILE=$(ls wheelhouse/sparse_numba-*-cp${PYTHON_VERSION_NO_DOT}-*.whl | head -n 1)
          if [ -z "$WHEEL_FILE" ]; then
            echo "Error: No matching wheel found for Python ${{ matrix.python-version }}"
            echo "Available wheels:"
            ls wheelhouse/*.whl
            exit 1
          fi
          echo "Installing wheel: $WHEEL_FILE"
          python -m pip install "$WHEEL_FILE" --verbose

      - name: Install the wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy numba --only-binary=llvmlite
          $pyver = "${{ matrix.python-version }}" -replace '\.', ''
          $wheel = Get-ChildItem wheelhouse/sparse_numba-*-cp${pyver}-*.whl | Select-Object -First 1
          if (-not $wheel) {
            Write-Error "No matching wheel found"
            Get-ChildItem wheelhouse/*.whl
            exit 1
          }
          Write-Host "Installing wheel: $($wheel.FullName)"
          python -m pip install $wheel.FullName --verbose

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        env:
          KMP_DUPLICATE_LIB_OK: 'TRUE'
        run: |
          python -m venv test_venv
          source test_venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install numpy numba --only-binary=llvmlite
          PYTHON_VERSION_NO_DOT=$(echo ${{ matrix.python-version }} | tr -d '.')
          pip install wheelhouse/sparse_numba-*-cp${PYTHON_VERSION_NO_DOT}-*.whl
          mkdir -p /tmp/test_dir
          cp run_tests.py /tmp/test_dir/
          cd /tmp/test_dir
          KMP_DUPLICATE_LIB_OK=TRUE python run_tests.py
          # the wheel's contents (no cache files, the version, the three
          # extensions, no SuiteSparse library), tests/test_sn6_wheel.py
          python -m pip install pytest
          cp -r "$GITHUB_WORKSPACE/tests" /tmp/test_dir/tests
          SPARSE_NUMBA_WHEEL=$(ls "$GITHUB_WORKSPACE"/wheelhouse/sparse_numba-*-cp${PYTHON_VERSION_NO_DOT}-*.whl | head -n 1) \
            python -m pytest tests/test_sn6_wheel.py -q -rs -p no:cacheprovider

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy numba --only-binary=llvmlite
          $pyver = "${{ matrix.python-version }}" -replace '\.', ''
          $wheel = Get-ChildItem wheelhouse/sparse_numba-*-cp${pyver}-*.whl | Select-Object -First 1
          python -m pip install $wheel.FullName
          $testDir = Join-Path $env:RUNNER_TEMP "test_dir"
          New-Item -ItemType Directory -Force -Path $testDir
          Copy-Item run_tests.py $testDir/
          Set-Location $testDir
          python run_tests.py

      # The suite from the installed wheel with UMFPACK ABSENT (no SuiteSparse
      # DLL on the runner; the UMFPACK cells skip by name, tests/conftest.py;
      # cache_key() reports umfpack=absent), the source-reading cells on the
      # checkout (SPARSE_NUMBA_SOURCE_DIR), the wheel's contents read
      # (SPARSE_NUMBA_WHEEL: no cache files, the seven DLLs with their
      # licences beside, no SuiteSparse DLL)
      - name: Run the test suite from the wheel (Windows, UMFPACK absent)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install pytest "setuptools>=70.1"
          $pyver = "${{ matrix.python-version }}" -replace '\.', ''
          $wheel = Get-ChildItem wheelhouse/sparse_numba-*-cp${pyver}-*.whl | Select-Object -First 1
          python -m pip install --force-reinstall --no-deps $wheel.FullName
          $env:SPARSE_NUMBA_WHEEL = $wheel.FullName
          $env:SPARSE_NUMBA_SOURCE_DIR = "${{ github.workspace }}"
          Remove-Item Env:SUITESPARSE_BIN -ErrorAction SilentlyContinue
          Remove-Item Env:SPARSE_NUMBA_UMFPACK_LIBRARY -ErrorAction SilentlyContinue
          $testDir = Join-Path $env:RUNNER_TEMP "sn_pytest"
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          Copy-Item -Recurse tests (Join-Path $testDir "tests")
          Set-Location $testDir
          python -c "import sparse_numba; k = sparse_numba.cache_key(); print(sparse_numba.__file__); print(k); assert 'site-packages' in sparse_numba.__file__; assert ';umfpack=absent;' in k"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests -q -rs -p no:cacheprovider --basetemp (Join-Path $env:RUNNER_TEMP "snbt")

  # Build source distribution (sdist) for PyPI
  build_sdist:
    needs: check_duplicate
    if: ${{ needs.check_duplicate.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel cython numpy setuptools

      - name: Build source distribution
        run: |
          python -m build --sdist

      - name: Upload sdist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz

  # Publish to PyPI when a tag is pushed
  upload_pypi:
    needs: [check_duplicate, build_wheels, build_sdist, test_installation]
    if: ${{ needs.check_duplicate.outputs.should_run == 'true' && needs.check_duplicate.outputs.is_tag == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: ./wheelhouse
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: ./dist

      - name: Prepare distribution files
        run: |
          mkdir -p final_dist
          cp wheelhouse/*.whl final_dist/
          cp dist/*.tar.gz final_dist/
          echo "Files to upload:"
          ls -la final_dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: final_dist/
