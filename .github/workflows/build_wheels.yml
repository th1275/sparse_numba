name: Build and Test sparse_numba

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  check_duplicate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      is_tag: ${{ steps.check.outputs.is_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "should_run=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/* ]] && [[ "${{ github.event_name }}" == "push" ]]; then
            if git tag --points-at HEAD | grep -q "^v"; then
              echo "should_run=false" >> $GITHUB_OUTPUT
            else
              echo "should_run=true" >> $GITHUB_OUTPUT
            fi
            echo "is_tag=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

  # Build wheels - one job per OS (cibuildwheel handles all Python versions)
  build_wheels:
    needs: check_duplicate
    if: ${{ needs.check_duplicate.outputs.should_run == 'true' }}
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel cython numpy setuptools twine
          python -m pip install cibuildwheel

      # Linux specific setup
      # The host's SuperLU headers only (cibuildwheel builds in the
      # manylinux_2_28 container, whose before-all installs its own); no
      # SuiteSparse on the host (UMFPACK is interface-only, and the full
      # SuiteSparse set stalled the job on the apt mirror, PR #1 runs 58-59)
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenblas-dev libsuperlu-dev
          echo "SuperLU header locations:"
          sudo find /usr -name "slu_ddefs.h" | grep superlu
          SUPERLU_HEADER=$(sudo find /usr -name "slu_ddefs.h" | grep superlu | head -n 1)
          if [ -n "$SUPERLU_HEADER" ]; then
            SUPERLU_DIR=$(dirname "$SUPERLU_HEADER")
            echo "Found SuperLU headers at: $SUPERLU_DIR"
            if [ ! -d "/usr/include/superlu" ]; then
              sudo mkdir -p /usr/include/superlu
              sudo cp "$SUPERLU_DIR"/*.h /usr/include/superlu/
            fi
          fi

      # Windows specific setup
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "Checking MinGW..."
          gcc --version || (echo "MinGW not found, installing..." && choco install mingw -y --no-progress)
          MINGW_BIN=$(dirname "$(which gcc)")
          echo "MinGW bin: $MINGW_BIN"
          echo "$MINGW_BIN" >> $GITHUB_PATH
          echo "Checking vendor libraries..."
          ls -la vendor/superlu/lib/ || echo "WARNING: SuperLU libs not found"
          ls -la vendor/superlu/bin/ || echo "WARNING: SuperLU bin not found"
          ls -la vendor/openblas/bin/ || echo "WARNING: OpenBLAS bin not found"

      # The UMFPACK extension is interface-only: it compiles against
      # umfpack.h and links no SuiteSparse library (the user's library is
      # loaded at runtime). Only the HEADERS are taken here: MSYS2's
      # SuiteSparse package is downloaded (pacman -Sw installs nothing) and
      # its include/suitesparse/*.h alone extracted into
      # vendor/suitesparse/include; no SuiteSparse DLL reaches the build or
      # the wheel.
      - name: Install the SuiteSparse headers only (Windows)
        if: runner.os == 'Windows'
        shell: C:\msys64\usr\bin\bash.exe --noprofile --norc -eo pipefail {0}
        run: |
          export PATH=/usr/bin:$PATH
          pacman -Sy --noconfirm
          pacman -Sw --noconfirm mingw-w64-x86_64-suitesparse
          pkg=$(ls /var/cache/pacman/pkg/mingw-w64-x86_64-suitesparse-[0-9]*.pkg.tar.zst | sort -V | tail -n 1)
          echo "headers from: $pkg"
          mkdir -p ss_pkg vendor/suitesparse/include
          tar --zstd -xf "$pkg" -C ss_pkg mingw64/include/suitesparse
          cp ss_pkg/mingw64/include/suitesparse/*.h vendor/suitesparse/include/
          rm -rf ss_pkg
          ls vendor/suitesparse/include
          test -f vendor/suitesparse/include/umfpack.h
          if ls vendor/suitesparse/bin/*.dll >/dev/null 2>&1; then
            echo "a SuiteSparse DLL is in the checkout"; exit 1
          fi

      # macOS specific setup
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install suite-sparse superlu openblas
          export OPENBLAS_PREFIX=$(brew --prefix openblas)
          echo "OpenBLAS prefix: $OPENBLAS_PREFIX"
          mkdir -p $HOME/homebrew_libs/openblas/lib
          ln -sf $OPENBLAS_PREFIX/lib/libopenblas.dylib $HOME/homebrew_libs/openblas/lib/
          echo "OPENBLAS_PREFIX=$OPENBLAS_PREFIX" >> $GITHUB_ENV
          echo "HOME_LIBS=$HOME/homebrew_libs" >> $GITHUB_ENV

      # Build wheels using cibuildwheel
      - name: Build wheels
        env:
          CIBW_BUILD: 'cp310-* cp311-* cp312-* cp313-*'
          CIBW_SKIP: '*-musllinux*'
          CIBW_BEFORE_BUILD: >
            pip install numpy cython
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ARCHS_MACOS: 'arm64'
          CIBW_ARCHS_LINUX: 'x86_64'
          CIBW_ENVIRONMENT: >
            CI=true
            GITHUB_ACTIONS=true
            CFLAGS='-O3'
            CXXFLAGS='-O3'
          CIBW_ENVIRONMENT_MACOS: >
            CI=true
            GITHUB_ACTIONS=true
            CFLAGS='-O3'
            CXXFLAGS='-O3'
            MACOSX_DEPLOYMENT_TARGET=14.0
          # manylinux_2_28 (AlmaLinux 8, glibc >= 2.28): current numpy ships
          # no manylinux2014 wheels, so CIBW_BEFORE_BUILD's pip install
          # would build numpy from source there (and fails)
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          # suitesparse-devel for umfpack.h only: the UMFPACK extension links
          # no SuiteSparse library, so auditwheel has none to bundle (the
          # check after the build asserts it). AlmaLinux 8: openblas-devel
          # and suitesparse-devel are in powertools, SuperLU-devel in EPEL
          CIBW_BEFORE_ALL_LINUX: |
            set -e
            dnf install -y dnf-plugins-core epel-release
            dnf config-manager --set-enabled powertools || dnf config-manager --set-enabled crb
            dnf install -y openblas-devel suitesparse-devel
            dnf install -y SuperLU-devel || dnf install -y superlu-devel
            find /usr/include -name umfpack.h || echo "umfpack.h not found"
            find /usr -name "slu_ddefs.h" || echo "SuperLU headers not found"
            HEADER_PATH=$(find /usr -name "slu_ddefs.h" | head -1)
            if [ -n "$HEADER_PATH" ]; then
              HEADER_DIR=$(dirname "$HEADER_PATH")
              mkdir -p /tmp/superlu_include
              if [ -f "$HEADER_DIR/slu_ddefs.h" ]; then
                cp "$HEADER_DIR"/*.h /tmp/superlu_include/ 2>/dev/null || true
              fi
            fi
            # The licence texts of the libraries auditwheel bundles into
            # sparse_numba.libs (SuperLU 5.x, OpenBLAS, ATLAS, libgfortran,
            # libquadmath): for each, the package owning the library and the
            # installed packages built from the same source package (gcc's
            # licence files are libgcc's; openblas's LICENSE is the base
            # package's), their rpm -qL files and rpm -qd's COPYING / LICENSE
            # files, copied into sparse_numba/third_party_licenses/linux/<name>/
            # with SOURCE.txt naming the packages (setup.py's Linux
            # package_data puts them in the wheel; tests/test_sn6_wheel.py
            # maps every bundled library to its folder). Missing texts are
            # reported here and fail that test
            LICDIR={project}/sparse_numba/third_party_licenses/linux
            printf '%s\n' 'superlu libsuperlu.so.*' 'openblas libopenblas*.so*' \
              'atlas libsatlas.so.*' 'atlas libtatlas.so.*' \
              'libgfortran libgfortran.so.*' 'libquadmath libquadmath.so.*' |
            while read -r key pattern; do
              mkdir -p "$LICDIR/$key"
              # (ATLAS's libraries sit in /usr/lib64/atlas/ on EL8)
              for lib in $(ls /usr/lib64/$pattern /usr/lib64/atlas/$pattern 2>/dev/null); do
                pkg=$(rpm -qf "$lib" 2>/dev/null) || continue
                srpm=$(rpm -q --qf '%{SOURCERPM}' "$pkg")
                pkgs="$pkg $(rpm -qa --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH} %{SOURCERPM}\n' | while read -r p s; do if [ "$s" = "$srpm" ]; then echo "$p"; fi; done)"
                collect() {
                  for p in $pkgs; do
                    for f in $(rpm -qL "$p" 2>/dev/null) $(rpm -qd "$p" 2>/dev/null | grep -i -E '/(copying|licen[cs]e)[^/]*$'); do
                      if [ -f "$f" ]; then cp -n "$f" "$LICDIR/$key/"; fi
                    done
                  done
                }
                collect
                if [ -z "$(ls "$LICDIR/$key" | grep -v -x SOURCE.txt)" ]; then
                  # the image installs without docs: every package of the
                  # source package again, with its doc and licence files
                  dnf reinstall -y --setopt=tsflags= $pkgs >/dev/null 2>&1 || true
                  collect
                fi
                if [ "$key" = atlas ] && [ -z "$(ls "$LICDIR/$key" | grep -v -x SOURCE.txt)" ]; then
                  # ATLAS's RPMs carry no licence file; its BSD licence is the
                  # comment block heading its headers (atlas-devel): copied
                  # from the first header that carries it, the file named
                  dnf install -y atlas-devel >/dev/null 2>&1 || true
                  hdr=$(grep -rl "Automatically Tuned Linear Algebra Software" /usr/include 2>/dev/null | head -n 1)
                  if [ -n "$hdr" ]; then
                    { echo "The ATLAS licence, as it heads $hdr (package $(rpm -qf "$hdr")):"; echo;
                      awk '/Automatically Tuned Linear Algebra Software/{p=1} p{print} /POSSIBILITY OF SUCH DAMAGE/{if(p) exit}' "$hdr"; } > "$LICDIR/$key/LICENSE.from-header.txt"
                    grep -q "POSSIBILITY OF SUCH DAMAGE" "$LICDIR/$key/LICENSE.from-header.txt" || rm -f "$LICDIR/$key/LICENSE.from-header.txt"
                  fi
                fi
                if [ -z "$(ls "$LICDIR/$key" | grep -v -x SOURCE.txt)" ]; then
                  echo "no licence file found for $key; what the packages carry:"
                  for p in $pkgs; do echo "  $p: $(rpm -q --qf '%{LICENSE}' "$p")"; rpm -qL "$p"; rpm -qd "$p" | head -20; done
                fi
                echo "$lib: $pkg (source $srpm; licence $(rpm -q --qf '%{LICENSE}' "$pkg")); licence files from: $pkgs" >> "$LICDIR/$key/SOURCE.txt"
              done
              echo "licence texts for $key:"; ls -l "$LICDIR/$key"
              ls "$LICDIR/$key" | grep -v -x SOURCE.txt >/dev/null || echo "WARNING: no licence text for $key"
            done
          CIBW_BEFORE_ALL_MACOS: >
            brew install suite-sparse superlu openblas;
            OPENBLAS_PREFIX=$(brew --prefix openblas);
            echo "OpenBLAS location: $OPENBLAS_PREFIX";
            mkdir -p $HOME/homebrew_libs/openblas/lib;
            ln -sf $OPENBLAS_PREFIX/lib/libopenblas.dylib $HOME/homebrew_libs/openblas/lib/;
            echo "Created symlink in $HOME/homebrew_libs/openblas/lib/"
          # Skip delocate on macOS -- the wheels load Homebrew's superlu /
          # openblas at run time, nothing is bundled (the Linux wheels, by
          # contrast, bundle theirs through auditwheel's repair)
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
            cp {wheel} {dest_dir}/
          # Skip delvewheel on Windows: the wheel already vendors the seven
          # DLLs its extensions import (sparse_numba/vendor/*/bin, with their
          # licences; found at import through os.add_dll_directory). A
          # repair with a search path would copy them a second time into
          # sparse_numba.libs; tests/test_sn6_wheel.py checks the set
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >
            python -c "import shutil, sys; shutil.copy(sys.argv[1], sys.argv[2])" {wheel} {dest_dir}
          CIBW_ARCHS_WINDOWS: 'AMD64'
          CIBW_ENVIRONMENT_WINDOWS: >
            CI=true
            GITHUB_ACTIONS=true
            DISTUTILS_USE_SDK=0
          CIBW_BEFORE_BUILD_WINDOWS: >
            pip install numpy cython setuptools &&
            python -c "import distutils, os; f=os.path.join(os.path.dirname(distutils.__file__),'distutils.cfg'); open(f,'w').write('[build]\ncompiler=mingw32\n[build_ext]\ncompiler=mingw32\n')" &&
            gcc --version

        run: |
          python -m cibuildwheel --output-dir wheelhouse

      # List built wheels for debugging
      - name: List built wheels
        shell: bash
        run: |
          echo "Built wheels:"
          ls -la wheelhouse/

      # No wheel carries a SuiteSparse library (GPL / LGPL; UMFPACK is the
      # user's): a file named after one fails the job
      - name: Check the wheels carry no SuiteSparse library
        shell: bash
        run: |
          python - <<'PY'
          import glob, re, sys, zipfile
          pattern = re.compile(r"(lib)?(umfpack|cholmod|amd|camd|colamd|ccolamd|"
                               r"suitesparseconfig|klu|btf|spqr|cxsparse|ldl)[.-]")
          wheels = sorted(glob.glob("wheelhouse/*.whl"))
          bad = [(whl, name) for whl in wheels for name in zipfile.ZipFile(whl).namelist()
                 if pattern.match(name.rsplit("/", 1)[-1].lower())]
          for whl, name in bad:
              print("%s: %s" % (whl, name))
          print("%d wheel(s) read, %d SuiteSparse file(s)" % (len(wheels), len(bad)))
          sys.exit(1 if bad or not wheels else 0)
          PY

      # Store the built wheels (one artifact per OS, containing all Python versions)
      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: |
            ./wheelhouse/*.whl

  # Test job - test each Python version per OS
  test_installation:
    needs: [check_duplicate, build_wheels]
    if: ${{ needs.check_duplicate.outputs.should_run == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            python-version: '3.10'
          - os: macos-latest
            python-version: '3.11'
          - os: macos-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.13'
          # Windows x86_64
          - os: windows-latest
            python-version: '3.10'
          - os: windows-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.13'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse

      - name: List available wheels
        shell: bash
        run: |
          echo "Available wheels:"
          ls -la wheelhouse/

      # The system SuperLU and OpenBLAS (the wheel bundles its own copies in
      # sparse_numba.libs through auditwheel); no SuiteSparse: UMFPACK is the
      # user's library, absent here as on the Windows runner (its cells skip
      # by name)
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenblas-dev libsuperlu-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install suite-sparse superlu openblas

      - name: Install the wheel (Unix)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy numba --only-binary=llvmlite
          # Find matching wheel using pip directly (handles platform tags automatically)
          PYTHON_VERSION_NO_DOT=$(echo ${{ matrix.python-version }} | tr -d '.')
          WHEEL_FILE=$(ls wheelhouse/sparse_numba-*-cp${PYTHON_VERSION_NO_DOT}-*.whl | head -n 1)
          if [ -z "$WHEEL_FILE" ]; then
            echo "Error: No matching wheel found for Python ${{ matrix.python-version }}"
            echo "Available wheels:"
            ls wheelhouse/*.whl
            exit 1
          fi
          echo "Installing wheel: $WHEEL_FILE"
          python -m pip install "$WHEEL_FILE" --verbose

      - name: Install the wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy numba --only-binary=llvmlite
          $pyver = "${{ matrix.python-version }}" -replace '\.', ''
          $wheel = Get-ChildItem wheelhouse/sparse_numba-*-cp${pyver}-*.whl | Select-Object -First 1
          if (-not $wheel) {
            Write-Error "No matching wheel found"
            Get-ChildItem wheelhouse/*.whl
            exit 1
          }
          Write-Host "Installing wheel: $($wheel.FullName)"
          python -m pip install $wheel.FullName --verbose

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        env:
          KMP_DUPLICATE_LIB_OK: 'TRUE'
        run: |
          python -m venv test_venv
          source test_venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install numpy numba --only-binary=llvmlite
          PYTHON_VERSION_NO_DOT=$(echo ${{ matrix.python-version }} | tr -d '.')
          pip install wheelhouse/sparse_numba-*-cp${PYTHON_VERSION_NO_DOT}-*.whl
          mkdir -p /tmp/test_dir
          cp run_tests.py /tmp/test_dir/
          cd /tmp/test_dir
          KMP_DUPLICATE_LIB_OK=TRUE python run_tests.py
          # the wheel's contents (no cache files, the version, the three
          # extensions, no SuiteSparse library; every library in
          # sparse_numba.libs with its licence text, none on macOS),
          # tests/test_sn6_wheel.py
          python -m pip install pytest
          cp -r "$GITHUB_WORKSPACE/tests" /tmp/test_dir/tests
          SPARSE_NUMBA_WHEEL=$(ls "$GITHUB_WORKSPACE"/wheelhouse/sparse_numba-*-cp${PYTHON_VERSION_NO_DOT}-*.whl | head -n 1) \
            python -m pytest tests/test_sn6_wheel.py -q -rs -p no:cacheprovider

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy numba --only-binary=llvmlite
          $pyver = "${{ matrix.python-version }}" -replace '\.', ''
          $wheel = Get-ChildItem wheelhouse/sparse_numba-*-cp${pyver}-*.whl | Select-Object -First 1
          python -m pip install $wheel.FullName
          $testDir = Join-Path $env:RUNNER_TEMP "test_dir"
          New-Item -ItemType Directory -Force -Path $testDir
          Copy-Item run_tests.py $testDir/
          Set-Location $testDir
          python run_tests.py

      # The suite from the installed wheel with UMFPACK ABSENT (no SuiteSparse
      # DLL on the runner; the UMFPACK cells skip by name, tests/conftest.py;
      # cache_key() reports umfpack=absent), the source-reading cells on the
      # checkout (SPARSE_NUMBA_SOURCE_DIR), the wheel's contents read
      # (SPARSE_NUMBA_WHEEL: no cache files, the seven DLLs with their
      # licences beside, no SuiteSparse DLL)
      # The 0.1.11 bit-identity cells hold on one BLAS kernel: the vendored
      # OpenBLAS picks its kernel by CPU at run time (a Windows 3.13 runner
      # differed in the last bits, PR #1 run at 1775bfc), so the kernel is
      # pinned to the one the oracle was banked on, and the CPU and the
      # kernel in use are printed
      - name: Run the test suite from the wheel (Windows, UMFPACK absent)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OPENBLAS_CORETYPE: Haswell
        run: |
          (Get-CimInstance Win32_Processor).Name
          python -m pip install pytest scipy "setuptools>=70.1"
          $pyver = "${{ matrix.python-version }}" -replace '\.', ''
          $wheel = Get-ChildItem wheelhouse/sparse_numba-*-cp${pyver}-*.whl | Select-Object -First 1
          python -m pip install --force-reinstall --no-deps $wheel.FullName
          $env:SPARSE_NUMBA_WHEEL = $wheel.FullName
          $env:SPARSE_NUMBA_SOURCE_DIR = "${{ github.workspace }}"
          Remove-Item Env:SUITESPARSE_BIN -ErrorAction SilentlyContinue
          Remove-Item Env:SPARSE_NUMBA_UMFPACK_LIBRARY -ErrorAction SilentlyContinue
          $testDir = Join-Path $env:RUNNER_TEMP "sn_pytest"
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          Copy-Item -Recurse tests (Join-Path $testDir "tests")
          Set-Location $testDir
          python -c "import sparse_numba; k = sparse_numba.cache_key(); print(sparse_numba.__file__); print(k); assert 'site-packages' in sparse_numba.__file__; assert ';umfpack=absent;' in k"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import ctypes, os, sparse_numba; d = os.path.join(os.path.dirname(sparse_numba.__file__), 'vendor', 'openblas', 'bin'); os.add_dll_directory(d); f = ctypes.CDLL(os.path.join(d, 'libopenblas.dll')).openblas_get_corename; f.restype = ctypes.c_char_p; print('OpenBLAS core:', f().decode())"
          python -m pytest tests -q -rs -p no:cacheprovider --basetemp (Join-Path $env:RUNNER_TEMP "snbt")

  # Build source distribution (sdist) for PyPI
  build_sdist:
    needs: check_duplicate
    if: ${{ needs.check_duplicate.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel cython numpy setuptools

      - name: Build source distribution
        run: |
          python -m build --sdist

      - name: Upload sdist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz

  # Publish to PyPI when a tag is pushed
  upload_pypi:
    needs: [check_duplicate, build_wheels, build_sdist, test_installation]
    if: ${{ needs.check_duplicate.outputs.should_run == 'true' && needs.check_duplicate.outputs.is_tag == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: ./wheelhouse
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: ./dist

      - name: Prepare distribution files
        run: |
          mkdir -p final_dist
          cp wheelhouse/*.whl final_dist/
          cp dist/*.tar.gz final_dist/
          echo "Files to upload:"
          ls -la final_dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: final_dist/
